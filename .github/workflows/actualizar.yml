name: Actualizar Tablero

on:
  schedule:
    - cron: "55 * * * *"   # cada hora, al minuto 55
  workflow_dispatch:        # botón "Run workflow" para probar a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar el Tablero cifrado de Drive
        run: |
          set -e
          PUNTERO="1V5Vh685DssRIrYc3Y2k0ghymfC1ZD4GAoqbTwdob85c"
          curl -fsSL "https://docs.google.com/spreadsheets/d/${PUNTERO}/export?format=csv" -o puntero.csv
          ID=$(head -1 puntero.csv | cut -d, -f1 | tr -d '"\r ')
          echo "Archivo en Drive: $ID"
          curl -fsSL "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" -o nuevo.html
          grep -q "staticrypt" nuevo.html
          test $(stat -c %s nuevo.html) -gt 100000
          mv nuevo.html index.html
          rm -f puntero.csv

      - name: Publicar si cambió
        run: |
          git config user.name "Tablero Grasshopper"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Tablero actualizado $(TZ=America/Mexico_City date '+%d/%m/%Y %H:%M')"
            git push
          fi
